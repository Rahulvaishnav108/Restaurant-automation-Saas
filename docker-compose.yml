services:
  mongo:
    image: mongo:7
    container_name: restaurant-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - restaurant-network

  mongo-init-replica:
    image: mongo:7
    container_name: restaurant-mongo-init
    depends_on:
      - mongo
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "until mongosh --host mongo:27017 --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; do sleep 2; done;
      mongosh --host mongo:27017 --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] }) }'"
    networks:
      - restaurant-network

  backend:
    build:
      context: ./backend
      target: dev
    container_name: restaurant-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/restaurant_automation?replicaSet=rs0
    networks:
      - restaurant-network
    depends_on:
      - mongo
      - mongo-init-replica

  frontend:
    build:
      context: ./frontend
    container_name: restaurant-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./frontend/.env
    networks:
      - restaurant-network
    depends_on:
      - backend

networks:
  restaurant-network:
    driver: bridge

volumes:
  mongo-data:
